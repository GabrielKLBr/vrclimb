<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VR Climb Game</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>

  <script>
    const GRAB_DISTANCE = 0.38;
    const GRAVITY = 9.5;
    const PUSH_SCALE = 2.2;
    const SLIP_RATE = 0.45;
    const SLIP_PULL_SCALE = 0.68;

    const levels = [
      {
        name: "Tutorial Wall",
        spawn: [0, 1.6, 4],
        respawn: [0, 1.6, 4],
        description: "Blue walls can be grabbed. Cyan walls are slippery. Dark walls cannot be grabbed.",
        surfaces: [
          { type: "climbable", pos: [0, 2.0, -4], size: [6, 4, 0.35] },
          { type: "climbable", pos: [0, 5.0, -7], size: [5, 1.2, 0.35] },
          { type: "slippery", pos: [0, 3.4, -10], size: [4, 2.0, 0.35] },
          { type: "ungrabbable", pos: [2.2, 2.0, -10], size: [1.4, 4.0, 0.35] },
          { type: "climbable", pos: [-2.6, 2.0, -13], size: [1.4, 4.0, 0.35] },
          { type: "climbable", pos: [0, 2.0, -16], size: [6, 4, 0.35] }
        ],
        checkpoints: [
          { pos: [0, 1.2, -8], size: [0.8, 1.4, 0.25] }
        ],
        goal: { pos: [0, 2.0, -19], size: [1.2, 2.6, 0.7] }
      },
      {
        name: "Wall Hop",
        spawn: [0, 1.6, 4],
        respawn: [0, 1.6, 4],
        description: "Push off one wall and catch the other.",
        surfaces: [
          { type: "climbable", pos: [-2.8, 2.1, -4], size: [2.2, 4.2, 0.35] },
          { type: "ungrabbable", pos: [0, 2.0, -6], size: [1.6, 4.5, 0.35] },
          { type: "climbable", pos: [2.8, 2.1, -8], size: [2.2, 4.2, 0.35] },
          { type: "slippery", pos: [0, 4.6, -10], size: [5.0, 1.2, 0.35] },
          { type: "climbable", pos: [-1.6, 2.1, -13], size: [2.4, 4.2, 0.35] },
          { type: "climbable", pos: [1.8, 2.1, -16], size: [2.4, 4.2, 0.35] }
        ],
        checkpoints: [
          { pos: [0, 1.2, -9], size: [0.8, 1.4, 0.25] }
        ],
        goal: { pos: [0, 2.0, -19], size: [1.2, 2.6, 0.7] }
      },
      {
        name: "Tower Run",
        spawn: [0, 1.6, 4],
        respawn: [0, 1.6, 4],
        description: "A taller climb with slippery top sections.",
        surfaces: [
          { type: "climbable", pos: [0, 1.9, -4], size: [4.6, 3.8, 0.35] },
          { type: "climbable", pos: [-2.2, 4.2, -7], size: [2.0, 3.2, 0.35] },
          { type: "ungrabbable", pos: [2.2, 4.2, -7], size: [2.0, 3.2, 0.35] },
          { type: "slippery", pos: [0, 6.8, -10], size: [5.0, 1.6, 0.35] },
          { type: "climbable", pos: [-2.0, 2.0, -13], size: [1.8, 4.0, 0.35] },
          { type: "climbable", pos: [2.0, 2.0, -16], size: [1.8, 4.0, 0.35] },
          { type: "climbable", pos: [0, 2.0, -19], size: [6.0, 4.0, 0.35] }
        ],
        checkpoints: [
          { pos: [0, 1.2, -9], size: [0.8, 1.4, 0.25] },
          { pos: [0, 1.2, -15], size: [0.8, 1.4, 0.25] }
        ],
        goal: { pos: [0, 2.0, -22], size: [1.2, 2.6, 0.7] }
      }
    ];

    let sceneReady = false;
    let gameState = "menu";
    let selectedLevel = 0;
    let surfaces = [];
    let checkpoints = [];
    let goalBox = null;
    let currentRespawn = new THREE.Vector3(0, 1.6, 4);

    function v3(arr) {
      return new THREE.Vector3(arr[0], arr[1], arr[2]);
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function pointToBoxDistance(p, b) {
      const dx = Math.max(Math.abs(p.x - b.pos.x) - b.size.x / 2, 0);
      const dy = Math.max(Math.abs(p.y - b.pos.y) - b.size.y / 2, 0);
      const dz = Math.max(Math.abs(p.z - b.pos.z) - b.size.z / 2, 0);
      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    }

    function closestPointOnBox(p, b) {
      return new THREE.Vector3(
        clamp(p.x, b.pos.x - b.size.x / 2, b.pos.x + b.size.x / 2),
        clamp(p.y, b.pos.y - b.size.y / 2, b.pos.y + b.size.y / 2),
        clamp(p.z, b.pos.z - b.size.z / 2, b.pos.z + b.size.z / 2)
      );
    }

    function boxNormalFromPoint(p, b) {
      const local = p.clone().sub(b.pos);
      const half = new THREE.Vector3(b.size.x / 2, b.size.y / 2, b.size.z / 2);
      const nx = half.x > 0 ? Math.abs(local.x) / half.x : 0;
      const ny = half.y > 0 ? Math.abs(local.y) / half.y : 0;
      const nz = half.z > 0 ? Math.abs(local.z) / half.z : 0;

      if (nx >= ny && nx >= nz) {
        return new THREE.Vector3(Math.sign(local.x) || 1, 0, 0);
      }
      if (ny >= nx && ny >= nz) {
        return new THREE.Vector3(0, Math.sign(local.y) || 1, 0);
      }
      return new THREE.Vector3(0, 0, Math.sign(local.z) || 1);
    }

    function clearNode(node) {
      while (node.firstChild) node.removeChild(node.firstChild);
    }

    function createBoxEntity(def, color) {
      const box = document.createElement("a-box");
      box.setAttribute("position", `${def.pos[0]} ${def.pos[1]} ${def.pos[2]}`);
      box.setAttribute("width", def.size[0]);
      box.setAttribute("height", def.size[1]);
      box.setAttribute("depth", def.size[2]);
      box.setAttribute("material", `shader: standard; color: ${color}; roughness: 0.95; metalness: 0.0`);
      box.setAttribute("shadow", "cast: true; receive: true");
      return box;
    }

    function createSurfaceRecord(def) {
      return {
        type: def.type,
        pos: v3(def.pos),
        size: new THREE.Vector3(def.size[0], def.size[1], def.size[2])
      };
    }

    function updateHud() {
      const hud = document.querySelector("#hudText");
      const sub = document.querySelector("#hudSubText");
      if (!hud || !sub) return;
      hud.setAttribute("value", levels[selectedLevel].name);
      sub.setAttribute("value", levels[selectedLevel].description);
    }

    function setMenuVisible(visible) {
      document.querySelector("#menuRoot").setAttribute("visible", visible);
    }

    function setGameVisible(visible) {
      document.querySelector("#gameRoot").setAttribute("visible", visible);
    }

    function respawnPlayer() {
      const rig = document.querySelector("#rig");
      const physics = rig.components["rig-physics"];
      rig.object3D.position.copy(currentRespawn);
      if (physics) physics.velocity.set(0, 0, 0);
      const msg = document.querySelector("#statusText");
      msg.setAttribute("value", "Respawned");
      setTimeout(() => {
        msg.setAttribute("value", "");
      }, 900);
    }

    function loadLevel(index) {
      selectedLevel = (index + levels.length) % levels.length;
      const level = levels[selectedLevel];

      const root = document.querySelector("#levelRoot");
      clearNode(root);

      surfaces = [];
      checkpoints = [];
      goalBox = null;

      currentRespawn.copy(v3(level.respawn));
      const rig = document.querySelector("#rig");
      const physics = rig.components["rig-physics"];
      rig.object3D.position.copy(v3(level.spawn));
      if (physics) physics.velocity.set(0, 0, 0);

      const floor = document.createElement("a-plane");
      floor.setAttribute("rotation", "-90 0 0");
      floor.setAttribute("width", "200");
      floor.setAttribute("height", "200");
      floor.setAttribute("material", "shader: standard; color: #666; roughness: 1");
      floor.setAttribute("shadow", "receive: true");
      root.appendChild(floor);

      const sky = document.querySelector("#sky");
      sky.setAttribute("color", "#9fd3ff");

      const ambient = document.querySelector("#ambientLight");
      ambient.setAttribute("intensity", "0.7");

      const dir = document.querySelector("#sunLight");
      dir.setAttribute("intensity", "1.0");

      level.surfaces.forEach(def => {
        const rec = createSurfaceRecord(def);
        surfaces.push(rec);

        const colors = {
          climbable: "#7c8ea6",
          slippery: "#8de3ff",
          ungrabbable: "#4c4c55"
        };

        const box = createBoxEntity(def, colors[def.type] || "#777777");
        root.appendChild(box);

        if (def.type === "slippery") {
          const glow = document.createElement("a-box");
          glow.setAttribute("position", `${def.pos[0]} ${def.pos[1]} ${def.pos[2] + 0.01}`);
          glow.setAttribute("width", def.size[0] * 0.96);
          glow.setAttribute("height", def.size[1] * 0.96);
          glow.setAttribute("depth", "0.02");
          glow.setAttribute("material", "shader: standard; color: #d7fbff; transparent: true; opacity: 0.12; emissive: #99eeff; emissiveIntensity: 0.25");
          root.appendChild(glow);
        }

        if (def.type === "ungrabbable") {
          const stripe = document.createElement("a-box");
          stripe.setAttribute("position", `${def.pos[0]} ${def.pos[1]} ${def.pos[2] + 0.02}`);
          stripe.setAttribute("width", def.size[0] * 0.98);
          stripe.setAttribute("height", "0.12");
          stripe.setAttribute("depth", "0.03");
          stripe.setAttribute("material", "shader: standard; color: #ff4b4b; emissive: #ff1d1d; emissiveIntensity: 0.2");
          root.appendChild(stripe);
        }
      });

      level.checkpoints.forEach((cp, i) => {
        checkpoints.push({
          pos: v3(cp.pos),
          size: new THREE.Vector3(cp.size[0], cp.size[1], cp.size[2])
        });

        const post = document.createElement("a-box");
        post.setAttribute("position", `${cp.pos[0]} ${cp.pos[1]} ${cp.pos[2]}`);
        post.setAttribute("width", cp.size[0]);
        post.setAttribute("height", cp.size[1]);
        post.setAttribute("depth", cp.size[2]);
        post.setAttribute("material", "shader: standard; color: #4dff9c; emissive: #1dff7d; emissiveIntensity: 0.25");
        root.appendChild(post);

        const label = document.createElement("a-text");
        label.setAttribute("value", `Checkpoint ${i + 1}`);
        label.setAttribute("position", `${cp.pos[0]} ${cp.pos[1] + 0.9} ${cp.pos[2] + 0.15}`);
        label.setAttribute("align", "center");
        label.setAttribute("color", "#ffffff");
        label.setAttribute("width", "3");
        root.appendChild(label);
      });

      goalBox = {
        pos: v3(level.goal.pos),
        size: new THREE.Vector3(level.goal.size[0], level.goal.size[1], level.goal.size[2])
      };

      const goal = document.createElement("a-box");
      goal.setAttribute("position", `${level.goal.pos[0]} ${level.goal.pos[1]} ${level.goal.pos[2]}`);
      goal.setAttribute("width", level.goal.size[0]);
      goal.setAttribute("height", level.goal.size[1]);
      goal.setAttribute("depth", level.goal.size[2]);
      goal.setAttribute("material", "shader: standard; color: #ffe75e; emissive: #fff2a0; emissiveIntensity: 0.35; transparent: true; opacity: 0.95");
      root.appendChild(goal);

      const goalText = document.createElement("a-text");
      goalText.setAttribute("value", "GOAL");
      goalText.setAttribute("position", `${level.goal.pos[0]} ${level.goal.pos[1] + 1.8} ${level.goal.pos[2] + 0.4}`);
      goalText.setAttribute("align", "center");
      goalText.setAttribute("color", "#ffffff");
      goalText.setAttribute("width", "4");
      root.appendChild(goalText);

      const hint = document.querySelector("#hintText");
      hint.setAttribute("value", "Trigger on a blue wall, move your hand down to rise up, release to push off.");
      updateHud();
      document.querySelector("#statusText").setAttribute("value", "");
    }

    function startGame() {
      setMenuVisible(false);
      setGameVisible(true);
      gameState = "play";
      loadLevel(selectedLevel);
    }

    function showMenu() {
      gameState = "menu";
      setGameVisible(false);
      setMenuVisible(true);
      const rig = document.querySelector("#rig");
      rig.object3D.position.set(0, 1.6, 0);
      const physics = rig.components["rig-physics"];
      if (physics) physics.velocity.set(0, 0, 0);
      document.querySelector("#hintText").setAttribute("value", "Use the menu to choose a level.");
    }

    function nextLevel() {
      if (selectedLevel < levels.length - 1) {
        selectedLevel += 1;
        startGame();
      } else {
        showMenu();
      }
    }

    AFRAME.registerComponent("menu-button", {
      schema: {
        action: { type: "string" },
        label: { type: "string" }
      },
      init: function () {
        const el = this.el;
        el.addEventListener("mouseenter", () => {
          el.setAttribute("material", "color", "#ffffff");
          el.setAttribute("text", "color", "#111111");
        });
        el.addEventListener("mouseleave", () => {
          el.setAttribute("material", "color", "#d6d6d6");
          el.setAttribute("text", "color", "#111111");
        });
        el.addEventListener("click", () => {
          if (this.data.action === "play") startGame();
          if (this.data.action === "prev") {
            selectedLevel = (selectedLevel - 1 + levels.length) % levels.length;
            updateHud();
            document.querySelector("#menuLevelText").setAttribute("value", `Level: ${levels[selectedLevel].name}`);
            document.querySelector("#menuDescText").setAttribute("value", levels[selectedLevel].description);
          }
          if (this.data.action === "next") {
            selectedLevel = (selectedLevel + 1) % levels.length;
            updateHud();
            document.querySelector("#menuLevelText").setAttribute("value", `Level: ${levels[selectedLevel].name}`);
            document.querySelector("#menuDescText").setAttribute("value", levels[selectedLevel].description);
          }
          if (this.data.action === "menu") showMenu();
        });
      }
    });

    AFRAME.registerComponent("rig-physics", {
      init: function () {
        this.velocity = new THREE.Vector3();
        window.playerVelocity = this.velocity;
      },
      tick: function (time, dt) {
        if (gameState !== "play") return;
        const delta = Math.min(dt / 1000, 0.05);

        if (window.activeGrabCount > 0) {
          this.velocity.set(0, 0, 0);
        } else {
          this.velocity.y -= GRAVITY * delta;
        }

        this.el.object3D.position.addScaledVector(this.velocity, delta);

        if (this.el.object3D.position.y < -8) {
          respawnPlayer();
          return;
        }

        const playerPos = this.el.object3D.position.clone();

        for (const cp of checkpoints) {
          if (pointToBoxDistance(playerPos, cp) < 0.55) {
            currentRespawn.copy(cp.pos.clone().add(new THREE.Vector3(0, 0.8, 0)));
            const s = document.querySelector("#statusText");
            s.setAttribute("value", "Checkpoint reached");
            setTimeout(() => s.setAttribute("value", ""), 900);
          }
        }

        if (goalBox && pointToBoxDistance(playerPos, goalBox) < 0.8) {
          const s = document.querySelector("#statusText");
          s.setAttribute("value", "Level complete");
          setTimeout(() => {
            s.setAttribute("value", "");
            nextLevel();
          }, 800);
        }
      }
    });

    AFRAME.registerComponent("grab-hand", {
      init: function () {
        this.pressed = false;
        this.grabbing = false;
        this.surface = null;
        this.lastPos = new THREE.Vector3();
        this.worldPos = new THREE.Vector3();
        this.handVel = new THREE.Vector3();
        this.normal = new THREE.Vector3();

        window.activeGrabCount = window.activeGrabCount || 0;

        const onDown = () => {
          this.pressed = true;
        };

        const onUp = () => {
          this.pressed = false;
          if (this.grabbing) this.release();
        };

        this.el.addEventListener("triggerdown", onDown);
        this.el.addEventListener("gripdown", onDown);
        this.el.addEventListener("triggerup", onUp);
        this.el.addEventListener("gripup", onUp);
      },

      tryGrab: function () {
        if (gameState !== "play" || this.grabbing) return;

        this.el.object3D.getWorldPosition(this.worldPos);

        let best = null;
        let bestDist = Infinity;

        for (const s of surfaces) {
          if (s.type === "ungrabbable") continue;
          const d = pointToBoxDistance(this.worldPos, s);
          if (d < GRAB_DISTANCE && d < bestDist) {
            best = s;
            bestDist = d;
          }
        }

        if (!best) return;

        this.grabbing = true;
        this.surface = best;
        this.lastPos.copy(this.worldPos);
        this.normal.copy(boxNormalFromPoint(this.worldPos, best));
        window.activeGrabCount += 1;
      },

      release: function () {
        if (!this.grabbing) return;

        if (gameState === "play" && window.playerVelocity) {
          const intoWall = Math.max(0, -this.handVel.dot(this.normal));
          if (intoWall > 0.001) {
            const impulse = this.normal.clone().multiplyScalar(intoWall * PUSH_SCALE);
            window.playerVelocity.add(impulse);
          }
        }

        this.grabbing = false;
        this.surface = null;
        window.activeGrabCount = Math.max(0, (window.activeGrabCount || 0) - 1);
      },

      tick: function (time, dt) {
        const delta = Math.min(dt / 1000, 0.05);
        this.el.object3D.getWorldPosition(this.worldPos);

        if (delta > 0) {
          this.handVel.copy(this.worldPos).sub(this.lastPos).divideScalar(delta);
        } else {
          this.handVel.set(0, 0, 0);
        }

        if (this.pressed && !this.grabbing) {
          this.tryGrab();
        }

        if (this.grabbing && gameState === "play") {
          const move = this.worldPos.clone().sub(this.lastPos);

          let scale = 1.0;
          if (this.surface && this.surface.type === "slippery") {
            scale = SLIP_PULL_SCALE;
            document.querySelector("#statusText").setAttribute("value", "Slippery surface");
          }

          const rig = document.querySelector("#rig").object3D;
          rig.position.sub(move.multiplyScalar(scale));

          if (this.surface && this.surface.type === "slippery") {
            rig.position.y -= SLIP_RATE * delta;
          }
        }

        this.lastPos.copy(this.worldPos);
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      const scene = document.querySelector("a-scene");
      scene.addEventListener("loaded", () => {
        sceneReady = true;
        document.querySelector("#menuLevelText").setAttribute("value", `Level: ${levels[selectedLevel].name}`);
        document.querySelector("#menuDescText").setAttribute("value", levels[selectedLevel].description);
        updateHud();
        showMenu();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") showMenu();
        if (e.key === "Enter" && gameState === "menu") startGame();
        if (e.key === "ArrowLeft" && gameState === "menu") {
          selectedLevel = (selectedLevel - 1 + levels.length) % levels.length;
          document.querySelector("#menuLevelText").setAttribute("value", `Level: ${levels[selectedLevel].name}`);
          document.querySelector("#menuDescText").setAttribute("value", levels[selectedLevel].description);
        }
        if (e.key === "ArrowRight" && gameState === "menu") {
          selectedLevel = (selectedLevel + 1) % levels.length;
          document.querySelector("#menuLevelText").setAttribute("value", `Level: ${levels[selectedLevel].name}`);
          document.querySelector("#menuDescText").setAttribute("value", levels[selectedLevel].description);
        }
      });
    });
  </script>
</head>

<body>
  <a-scene
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: true"
    background="color: #9fd3ff"
  >
    <a-assets></a-assets>

    <a-entity id="sky" sky="color: #9fd3ff"></a-entity>

    <
